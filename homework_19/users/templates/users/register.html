{% extends "books/base.html" %}
{% load i18n %}

{% block content %}

<h2>{% translate "Register" %}</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        {% translate "Register" %}
    </button>
</form>

<p>
    {% translate "Already have an account?" %}

    <a href="{% url 'login' %}">
        {% translate "Login" %}
    </a>
</p>

{% endblock %}
