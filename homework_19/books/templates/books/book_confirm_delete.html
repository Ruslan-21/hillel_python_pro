{% extends "books/base.html" %}
{% load i18n %}

{% block content %}

<h1>{% translate "Delete book" %}</h1>

<p>
    {% translate "Are you sure you want to delete the book" %}
    "{{ object.title }}"?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        {% translate "Yes, delete" %}
    </button>
</form>

<a href="{% url 'books:list' %}">
    {% translate "Cancel" %}
</a>

{% endblock %}
