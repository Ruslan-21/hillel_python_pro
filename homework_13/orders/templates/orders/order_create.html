<h1>Оформлення замовлення</h1>


<h2>Ваш кошик</h2>

{% for item in cart %}

<p>
    {{ item.book.title }}
    -
    {{ item.quantity }}
    x
    {{ item.price }}
</p>

{% empty %}

<p>Кошик порожній</p>

{% endfor %}



<h2>Дані покупця</h2>


<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Оформити замовлення
    </button>

</form>
