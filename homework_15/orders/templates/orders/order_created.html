{% extends "books/base.html" %}
{% load i18n %}

{% block content %}

<h1>{% translate "Thank you for your order!" %}</h1>

<p>
    {% translate "Your order" %} №{{ order.id }}
</p>

<form action="{% url 'orders:create_checkout_session' order.id %}" method="post">

    {% csrf_token %}

    <button type="submit">
        {% translate "Pay" %}
    </button>

</form>

{% endblock %}
