{% extends "books/base.html" %}

{% block content %}

<h1>Видалити книгу</h1>

<p>Ви дійсно хочете видалити книгу "{{ object.title }}"? </p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Так, видалити</button>

</form>

<a href="{% url 'books:books' %}">Скасувати</a>

{% endblock %}
